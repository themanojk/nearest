name: kid-audio-intelligence

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "57017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kid-audio-local
      MINIO_ROOT_PASSWORD: kid-audio-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5173}"
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data

volumes:
  mongodb-data:
  redis-data:
  minio-data:
