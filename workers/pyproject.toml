[project]
name = "audio-workers"
version = "0.1.0"
description = "Python inference services for the Kid Audio Intelligence System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "faster-whisper>=1.2,<2",
    "kaldi-native-fbank>=1.22,<2",
    "numpy>=2.3,<3",
    "onnxruntime>=1.22,<2",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
    "webrtcvad-wheels>=2.0.14,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_workers"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
